[package]
name = "synthetic-vcf-generator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "synthetic-vcf-generator-rst"
path = "src/main.rs"

[dependencies]
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
rand_pcg = "0.3"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
thiserror = "1.0"
lazy_static = "1.4"
regex = "1.10"

